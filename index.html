<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <script src="gallery.js"></script>
  </head>
  <body onload="initializeGallery()">
    <header>
      <h1>Accessible Photo Gallery</h1>
    </header>

    <main>
      <!-- Vùng hiển thị ảnh lớn và nội dung alt -->
      <div id="image">Hover over or tab to an image below to display here.</div>

      <!-- Thư viện gồm 6 ảnh -->
      <div class="gallery">
        <img
          class="preview"
          alt="Scenic mountain view at dawn"
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          class="preview"
          alt="Dense green pine forest"
          src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          class="preview"
          alt="Calm tropical beach shore"
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          class="preview"
          alt="Autumn trail through yellow trees"
          src="https://images.unsplash.com/photo-1476820865390-c52aeebb9891?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          class="preview"
          alt="Vibrant night cityscape and skyscrapers"
          src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          class="preview"
          alt="Wavy golden sand desert dunes"
          src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=500&q=80"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>
    </main>
  </body>
</html>
